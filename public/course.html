        .toc-card {
    position: relative; 
    z-index: 1; /* 確保卡片內容在陰影之上 */
    overflow: hidden; /* 防止偽元素的陰影超出卡片 */
}

/* 發光主體：使用 ::after 偽元素作為光暈層 */
.toc-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: inherit; /* 繼承卡片的圓角 */
    box-shadow: 0 0 10px rgba(79, 70, 229, 0), /* 預設無陰影 */
                0 0 20px rgba(79, 70, 229, 0); 
    transition: box-shadow 0.5s ease-in-out; 
    z-index: -1; /* 讓光暈在卡片下方 */
}

/* 滑鼠懸停時啟動發光 */
.toc-card:hover::after {
    /* 使用 indigo-600 的顏色 (79, 70, 229) */
    box-shadow: 0 0 15px rgba(79, 70, 229, 0.6), /* 內層光暈 */
                0 0 30px rgba(79, 70, 229, 0.4), /* 外層光暈 */
                0 0 45px rgba(79, 70, 229, 0.2); /* 最外層光暈 */
}
      @keyframes pulse-glow {
    /* 1. 調整 0% 和 100% 狀態：設定一個中等強度的基礎光暈 */
    0% {
        /* 使用較低的透明度作為基底光暈，確保不會完全消失 */
        box-shadow: 0 0 5px 2px rgba(79, 70, 229, 0.4); 
    }
    
    /* 2. 調整 50% 狀態：設定一個高強度的光暈，作為最亮點 */
    50% {
        /* 設定最高的亮度，讓光暈向外擴散，呈現「呼吸」效果 */
        box-shadow: 0 0 15px 7px rgba(79, 70, 229, 0.7),
                    0 0 30px 10px rgba(79, 70, 229, 0.3);
    }
    
    /* 3. 確保 100% 結束於中等強度，與 0% 連續平滑 */
    100% {
        /* 與 0% 相同，保持一個基礎光暈 */
        box-shadow: 0 0 5px 2px rgba(79, 70, 229, 0.4); 
    }
}

async function fetchTeamMembers(managerTeam) {
    const loggedInUser = sessionStorage.getItem('loggedInUser');
    const loggedInRole = sessionStorage.getItem('loggedInRole');
    const managerControlPanel = document.getElementById('manager-control-panel');
    
    
    const populateMembers = (teamToDisplay, allUsers, currentTarget) => {
        const teamMembers = allUsers.filter(
            user => user.team === teamToDisplay && user.role === 'agent'
        );
        const selectElement = document.getElementById('team-member-select');
        const loggedInName = sessionStorage.getItem('loggedInName');
        
        
        let optionsHtml = `<option value="PROMPT_SELECT" disabled selected>-- 請選擇業務員 --</option>`;
        
        
        teamMembers.forEach(member => {
            const option = document.createElement('option');
            option.value = member.username;
            option.textContent = `${member.name} (${member.username}) - ${member.team}`;
            
            
            if (member.username === currentTarget) {
                 option.selected = true;
            }
            optionsHtml += option.outerHTML;
        });
        
        selectElement.innerHTML = optionsHtml;
        
       
        const selectedUser = allUsers.find(u => u.username === currentTarget);
        document.getElementById('current-progress-name').textContent = selectedUser ? selectedUser.name : '未選擇';
    };
    
    try {
        const response = await fetch('/.netlify/functions/get_users');
        const data = await response.json();
        
        if (!data.success) {
            console.error('API回傳失敗:', data.message);
            if (managerControlPanel) {
                 managerControlPanel.innerHTML = `<p class="text-red-500 p-4">無法載入組員列表，請檢查連線或後台配置。</p>`;
            }
            return;
        }
        const allUsers = data.users;
        
        
        let targetTeam = managerTeam;
        let targetUser = 'PROMPT_SELECT'; 
        
        if (loggedInRole === 'director') {
            const uniqueTeams = [...new Set(allUsers.map(user => user.team))].filter(t => t);
            
            const currentSelectedTeam = sessionStorage.getItem('currentSelectedTeam') || 'A組';
            targetTeam = uniqueTeams.includes(currentSelectedTeam) ? currentSelectedTeam : uniqueTeams[0];
            
            
            managerControlPanel.innerHTML = `
                 <div class="flex items-center justify-between mb-3">
                     <h5 class="font-bold text-indigo-700">總監控制面板 (可切換組別)</h5>
                     <button id="back-to-dashboard-btn" class="inline-flex items-center px-3 py-1 bg-amber-600 text-white text-xs font-semibold rounded-lg hover:bg-amber-700 transition duration-200 shadow-md">

                     </button>
                 </div>
                 <div id="team-and-member-controls" class="flex flex-col sm:flex-row gap-3">
                     <select id="team-filter-select" class="w-full sm:w-1/2 p-2 border border-indigo-300 rounded-lg bg-white text-slate-700 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
                         ${uniqueTeams.map((team, index) => `<option value="${team}" ${team === targetTeam ? 'selected' : ''}>${team} 進度</option>`).join('')}
                     </select>
                     <select id="team-member-select" class="w-full sm:w-1/2 p-2 border border-indigo-300 rounded-lg bg-white text-slate-700 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
                     </select>
                 </div>
                 <div id="current-user-info" class="w-full mt-3 p-2 bg-indigo-100 rounded-lg text-sm text-indigo-700 flex items-center justify-center">
                     目前查看：<span id="current-progress-name" class="font-bold ml-1">未選擇</span>
                 </div>
            `;
            
           
            populateMembers(targetTeam, allUsers, targetUser);
            
            
            const teamFilterSelect = document.getElementById('team-filter-select');
            teamFilterSelect.addEventListener('change', (e) => {
                const newTeam = e.target.value;
                sessionStorage.setItem('currentSelectedTeam', newTeam);
                
                currentViewingUser = 'PROMPT_SELECT'; 
                
                populateMembers(newTeam, allUsers, 'PROMPT_SELECT'); 
                
                loadProgressFromFirebase(); 
            });
        } else {
             
             populateMembers(managerTeam, allUsers, targetUser);
        }
        
        const memberSelectElement = document.getElementById('team-member-select');
        
        if(memberSelectElement._listener) {
             memberSelectElement.removeEventListener('change', memberSelectElement._listener);
        }
        
        const memberChangeListener = (e) => {
            const selectedUsername = e.target.value;
            const selectedUser = allUsers.find(u => u.username === selectedUsername);
            currentViewingUser = selectedUsername;
            
            document.getElementById('current-progress-name').textContent = selectedUser ? selectedUser.name : '未選擇';
            
            loadProgressFromFirebase();
        };
        memberSelectElement.addEventListener('change', memberChangeListener);
        memberSelectElement._listener = memberChangeListener; 
        
       
        currentViewingUser = targetUser;
        loadProgressFromFirebase();
    } catch (error) {
        console.error('Failed to fetch team members:', error);
        if (managerControlPanel) {
            managerControlPanel.innerHTML = `<p class="text-red-500 p-4">無法載入組員列表，請檢查連線或後台配置。</p>`;
        }
    }
}

async function loadAllMemberProgress() {
    const tableBody = document.getElementById('member-progress-table');
    const loggedInRole = sessionStorage.getItem('loggedInRole');
    const loggedInTeam = sessionStorage.getItem('loggedInTeam');
    
    if (!tableBody || typeof db === 'undefined') {
        console.error("無法找到表格容器或 Firebase 未準備好。");
        return;
    }

    try {
        const userResponse = await fetch('/.netlify/functions/get_users');
        const userData = await userResponse.json();
        if (!userData.success) throw new Error(userData.message);
        const allAgents = userData.users.filter(user => 
            user.role === 'agent' && (loggedInRole === 'director' || user.team === loggedInTeam)
        );
        if (allAgents.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-500">目前團隊中沒有業務員。</td></tr>`;
            return;
        }

        const progressPromises = allAgents.map(agent => 
            db.collection("progressData").doc(agent.username).get().then(doc => ({
                agent,
                progress: doc.exists ? doc.data() : {}
            }))
        );
        const allProgressResults = await Promise.all(progressPromises);

        
        const progressItemsToCount = progressItems.filter(item => item.type !== 'header');
        const progressItemsCount = progressItemsToCount.length;

        tableBody.innerHTML = '';
        allProgressResults.forEach(({ agent, progress }) => {
            let completedCount = 0;
            const allItemsHtml = []; 
            
            progressItemsToCount.forEach((item) => {
                const index = progressItems.findIndex(i => i.name === item.name);
                const itemData = progress[index];
                
                let isCompleted = false;
                const isCheckedByManager = itemData?.checked || false; 
                
                
                if (item.counts && item.counts.length > 0) {
                    const allCountsFilled = item.counts.every(countName => {
                        const value = itemData?.counts?.[countName] || '';
                        return value.trim() !== ''; 
                    });
                    if (isCheckedByManager && allCountsFilled) {
                        isCompleted = true;
                    }
                } else {
                    isCompleted = isCheckedByManager;
                }
                
                const itemName = item.name;
                
               
                const hasDetails = itemData?.remark || item.counts?.some(c => itemData?.counts?.[c]);

                if (isCompleted) {
                    completedCount++;
                    
                    allItemsHtml.push(`
                        <li class="flex items-start text-sm text-green-700 leading-snug space-x-2">
                            <i class="fas fa-check-circle text-green-500 mt-0.5 flex-shrink-0"></i>
                            <div class="flex-1">${itemName} ${hasDetails ? `<span class="text-xs text-slate-500"></span>` : ''}</div>
                        </li>
                    `);
                } else {
                    
                    allItemsHtml.push(`
                        <li class="flex items-start text-sm text-red-700 leading-snug space-x-2">
                            <i class="fas fa-times-circle text-red-500 mt-0.5 flex-shrink-0"></i>
                            <div class="flex-1">${itemName} ${hasDetails ? `<span class="text-xs text-slate-500"></span>` : ''}</div>
                        </li>
                    `);
                }
            });

            const incompleteCount = progressItemsCount - completedCount;
            const percentage = progressItemsCount > 0 ? Math.round((completedCount / progressItemsCount) * 100) : 0;
          
            const memberKey = agent.username; 
            
           
            const mainRow = document.createElement('tr');
            mainRow.className = 'main-progress-row';
            mainRow.innerHTML = `
                <td class="p-3">
                    <button class="text-indigo-600 font-bold hover:text-indigo-800 transition duration-200 text-left" onclick="window.viewAgentProgress('${agent.username}', '${agent.name}')">
                        ${agent.name} (${agent.team})
                    </button>
                </td>
                <td class="p-3">
                    <div class="font-bold text-lg ${percentage === 100 ? 'text-green-600' : 'text-orange-500'}">${percentage}%</div>
                </td>
    
                <td class="p-3">
                    <span class="text-green-600 font-bold">✅ ${completedCount} 項</span> /
                    <span class="text-red-600 font-bold">❌ ${incompleteCount} 項</span>
                    (共 ${progressItemsCount} 項)
                </td>
            `; 
            tableBody.appendChild(mainRow);
            
            
            const detailRow = document.createElement('tr');
            detailRow.className = 'detail-progress-row bg-slate-50 border-b border-slate-200';

                <td colspan="3" class="p-4 pt-2">

        console.error('載入所有業務進度失敗:', error);

                ${question.options.map((option, optIndex) => `
                    <div class="option-item flex items-start p-3 border rounded-lg cursor-pointer transition duration-150 ease-in-out hover:bg-indigo-50" data-index="${optIndex}">
                        <span class="option-label font-bold text-indigo-600 mr-3">${optionLabels[optIndex]}.</span>

    function updateSubmitButtonState() {
        const allAnswered = currentQuiz.every(q => {

        });
        
        submitQuizBtn.disabled = !allAnswered;
    if (submitQuizBtn.disabled) {
        submitQuizBtn.classList.add('opacity-50', 'cursor-not-allowed');
    } else {
        submitQuizBtn.classList.remove('opacity-50', 'cursor-not-allowed');

}

        if (!questionDiv) return;

    async function fetchQuiz() {
        document.body.scrollTop = 0; 
    document.documentElement.scrollTop = 0; 
       
        quizContainer = document.getElementById('quiz-container');
        quizStatus = document.getElementById('quiz-status');
        quizQuestionsArea = document.getElementById('quiz-questions-area');

        retakeQuizBtn = document.getElementById('retake-quiz-btn');
        backToTocQuizBtn = document.getElementById('back-to-toc-quiz-btn');
        
        if (!quizStatus || !startQuizBtn) {
             console.error("Quiz elements not found in active DOM. Aborting fetchQuiz.");
             return; 
        }

        quizStatus.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>測驗載入中，請稍候...';
        startQuizBtn.classList.add('hidden');
        submitQuizBtn.classList.add('hidden');
        quizResultArea.classList.add('hidden');
        quizQuestionsArea.innerHTML = '';
        isQuizSubmitted = false;
        currentQuiz = [];
        answersCache = [];
        
        try {
            
            const response = await fetch('/.netlify/functions/get_quiz');
            const data = await response.json();
            
            if (data.success && data.quiz && data.quiz.length > 0) {
                currentQuiz = data.quiz;
                answersCache = data.answersCache;
                
                quizStatus.className = 'mb-4 p-4 bg-green-50 rounded-lg text-green-800 font-semibold text-center';
                quizStatus.innerHTML = `<i class="fas fa-check-circle mr-2"></i>題目已載入！請點擊下方按鈕開始作答。`;
                
                startQuizBtn.classList.remove('hidden');
                startQuizBtn.textContent = `開始測驗 (${currentQuiz.length} 題)`;
                bindQuizEventListeners();
            } else {
                quizStatus.className = 'mb-4 p-4 bg-red-100 rounded-lg text-red-800 font-semibold text-center';
                quizStatus.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>載入失敗：${data.message || '後端題目庫無資料或連線錯誤。'}`;
                bindQuizEventListeners();
            }
        } catch (error) {
    console.error('Fetch quiz error:', error);
    quizStatus.className = 'mb-4 p-4 bg-red-100 rounded-lg text-red-800 font-semibold text-center';
    quizStatus.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>連線錯誤：無法從伺服器載入題目。請<b class="text-red-900">重新整理頁面</b>後再試！`;
    
    
    startQuizBtn.classList.remove('hidden'); 
    startQuizBtn.textContent = '重新載入題目'; 
            bindQuizEventListeners();
}
    }

  function startQuiz() {
const loggedInUser = sessionStorage.getItem('loggedInUser');
    if (!loggedInUser) {
        alert("系統閒置超時，您的登入狀態已失效，請重新登入！");
        
        window.performLogout(); 
        return;
    }
    
   
    if (!currentQuiz || currentQuiz.length === 0) {
        alert("題目載入失敗或尚未準備好，請稍候片刻或點擊重試。");
        
        fetchQuiz(); 
        return;
    }
    
    quizQuestionsArea.innerHTML = '';
    isQuizSubmitted = false;

   
    if (quizQuestionsArea) {
        quizQuestionsArea.style.pointerEvents = 'auto'; 
    }

  
    quizQuestionsArea.querySelectorAll('.quiz-question').forEach(q => {
        
        q.classList.remove('border-green-500', 'bg-green-50', 'border-red-500', 'bg-red-50');
        
        
        q.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected', 'bg-indigo-100', 'border-indigo-500', 'opacity-50', 'bg-green-200', 'border-green-600', 'bg-red-200', 'border-red-600');
            item.classList.add('border-slate-200', 'cursor-pointer', 'hover:bg-indigo-50');
            item.querySelector('.correct-icon').classList.add('hidden');
            item.querySelector('.incorrect-icon').classList.add('hidden');
        });
    });
    
    
    quizResultArea.classList.add('hidden');      
    submitQuizBtn.classList.remove('hidden');   
    
    
        currentQuiz.forEach((q, index) => {
            quizQuestionsArea.appendChild(renderQuestion(q, index));
        });
        
        quizStatus.className = 'mb-4 p-4 bg-indigo-50 rounded-lg text-indigo-800 font-semibold text-center';
        quizStatus.innerHTML = `<i class="fas fa-pencil-alt mr-2"></i>請依序作答，完成後點擊提交。`;
        startQuizBtn.classList.add('hidden');
        submitQuizBtn.classList.remove('hidden');
        
        
        submitQuizBtn.disabled = true;
        updateSubmitButtonState();
        
       
    }

    async function submitQuiz() {
        if (submitQuizBtn.disabled) return;
        
        const userAnswers = [];
        quizQuestionsArea.querySelectorAll('.quiz-question').forEach(qDiv => {
            const questionId = parseInt(qDiv.dataset.questionId);
            const selectedOption = qDiv.querySelector('.option-item.selected');
            
            userAnswers.push({
                questionId: questionId,
                selectedIndex: selectedOption ? parseInt(selectedOption.dataset.index) : -1
            });
        });
        
        if (userAnswers.length !== currentQuiz.length) {
           
             quizStatus.className = 'mb-4 p-4 bg-red-100 rounded-lg text-red-800 font-semibold text-center';
             quizStatus.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>提交失敗：題目數量不符。`;
             return;
        }
        
        
        quizStatus.className = 'mb-4 p-4 bg-yellow-100 rounded-lg text-yellow-800 font-semibold text-center';
        quizStatus.innerHTML = `<i class="fas fa-upload fa-bounce mr-2"></i>成績提交與批改中，請稍候...`;
        submitQuizBtn.disabled = true;
        
        try {
           
            const response = await fetch('/.netlify/functions/submit_quiz', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userAnswers, answersCache })
            });
            const result = await response.json();
            
            if (result.success) {
                isQuizSubmitted = true;
                renderResults(result);
            const quizContainer = document.getElementById('quiz-container');
                if (quizContainer) {
                    quizContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            } else {
                quizStatus.className = 'mb-4 p-4 bg-red-100 rounded-lg text-red-800 font-semibold text-center';
                quizStatus.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>提交失敗：${result.message || '後端處理成績時發生錯誤。'}`;
                submitQuizBtn.disabled = false;
            }
        } catch (error) {
            console.error('Submit quiz error:', error);
            quizStatus.className = 'mb-4 p-4 bg-red-100 rounded-lg text-red-800 font-semibold text-center';
            quizStatus.innerHTML = `<i class="fas fa-exclamation-triangle mr-2"></i>連線錯誤：無法提交成績。`;
            submitQuizBtn.disabled = false;
        }
    }

    function renderResults(result) {
        quizQuestionsArea.querySelectorAll('.option-item').forEach(item => item.classList.remove('cursor-pointer', 'hover:bg-indigo-50'));
        
        submitQuizBtn.classList.add('hidden');
        quizQuestionsArea.style.pointerEvents = 'none'; 

        document.getElementById('final-score').textContent = result.score;
        document.getElementById('correct-count-display').textContent = `答對題數：${result.correctCount} / ${result.totalQuestions} 題`;
        
       let detailedResultsHtml = ''
        result.results.forEach((res, index) => {
            const question = currentQuiz.find(q => q.id === res.questionId);
            if (!question) return;
            
            const isCorrect = res.isCorrect;
            const colorClass = isCorrect ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50';
            const iconClass = isCorrect ? 'fa-check-circle text-green-600' : 'fa-times-circle text-red-600';
            const resultTitle = isCorrect ? '恭喜答對！' : '很可惜答錯了！';
            
            
            
            const questionDiv = quizQuestionsArea.querySelector(`[data-question-id="${question.id}"]`);
            questionDiv.className += ` ${colorClass}`; 
            

            
            const optionsArea = quizQuestionsArea.querySelector(`[data-question-id="${question.id}"] #options-${question.id}`);
            optionsArea.querySelectorAll('.option-item').forEach(item => {
                 const itemIndex = parseInt(item.dataset.index);
                 
                 if (itemIndex === res.correctSelectedIndex) {
                     
                     item.classList.add('bg-green-200', 'border-green-600');
                     item.querySelector('.correct-icon').classList.remove('hidden');
                 } else if (itemIndex === res.userSelectedIndex && !isCorrect) {
                     
                     item.classList.add('bg-red-200', 'border-red-600');
                     item.querySelector('.incorrect-icon').classList.remove('hidden');
                 } else {
                     item.classList.add('opacity-50');
                 }
                 item.classList.remove('selected', 'bg-indigo-100', 'border-indigo-500', 'hover:bg-indigo-50');
            });
            
            
            const sourceAnswer = answersCache.find(a => a.id === res.questionId);
            
            detailedResultsHtml += `
                <div class="p-4 rounded-lg border-2 ${colorClass} shadow-md">
        <p class="font-bold text-lg flex items-center">
            <i class="fas ${iconClass} mr-3"></i> 
            ${index + 1}. ${question.topic} - <span class="ml-2 ${isCorrect ? 'text-green-700' : 'text-red-700'}">${resultTitle}</span>
        </p>
        
        </div>
`;
        });
        
        document.getElementById('detailed-results').innerHTML = '';
        
        quizStatus.className = 'mb-4 p-4 bg-green-50 rounded-lg text-green-800 font-semibold text-center';
        quizStatus.innerHTML = `<i class="fas fa-trophy mr-2"></i>成績公佈：請檢視下方答案與得分！`;
        
        quizResultArea.classList.remove('hidden');
    }

   
if (mainContentArea) {
        
        mainContentArea.addEventListener('click', handleOptionClick); 
    }
function bindQuizEventListeners() {
    
    const startBtn = document.getElementById('start-quiz-btn');
    const submitBtn = document.getElementById('submit-quiz-btn');
    const retakeBtn = document.getElementById('retake-quiz-btn');
    const backToTocBtn = document.getElementById('back-to-toc-quiz-btn');



    if (startBtn) {
        startBtn.removeEventListener('click', startQuiz);
        startBtn.addEventListener('click', startQuiz);
    }
    if (submitBtn) {
        submitBtn.removeEventListener('click', submitQuiz);
        submitBtn.addEventListener('click', submitQuiz);
    }
    if (retakeBtn) {
        retakeBtn.removeEventListener('click', fetchQuiz);
        retakeBtn.addEventListener('click', fetchQuiz);
    }
    if (backToTocBtn) {
        backToTocBtn.removeEventListener('click', showTOC);
        backToTocBtn.addEventListener('click', showTOC);
    }
}
   
});

    <script>
        const particleOverlay = document.getElementById('particle-overlay');

        if (particleOverlay) {
            // 設置一個極小的 CSS 3D 景深效果，讓粒子看起來不是貼在螢幕上
            particleOverlay.style.transition = 'transform 0.1s linear';
            
            // 監聽滑鼠移動事件，用於體積光和景深
            document.addEventListener('mousemove', (e) => {
                
                const x = e.clientX;
                const y = e.clientY;

                // 應用 CSS 樣式：模擬光線追蹤 (提高光暈強度到 0.3)
                particleOverlay.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(100, 150, 255, 0.15) 0%, rgba(0, 0, 0, 0) 15%)`;

                // 粒子景深/視差效果：讓粒子層隨著滑鼠輕微移動 (景深因子提高到 12)
                const depthFactor = 12; 
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const offsetX = (e.clientX - centerX) / centerX;
                const offsetY = (e.clientY - centerY) / centerY;
                
                particleOverlay.style.transform = `translateX(${-offsetX * depthFactor}px) translateY(${-offsetY * depthFactor}px)`;
            });

            // 滑鼠移出時，恢復預設光暈
            document.addEventListener('mouseleave', () => {
  
    particleOverlay.style.background = 'transparent';
    particleOverlay.style.transform = 'translate(0, 0)';
});
        }
    </script>
