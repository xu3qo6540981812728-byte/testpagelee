<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菁英班教育訓練 - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 核心背景設定 --- */
        body {
            background-color: #000000;
            margin: 0;
            overflow: hidden; /* 隱藏卷軸，讓體驗更像應用程式 */
            font-family: 'Noto Sans TC', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 環境光融合 (解決分界線太明顯的問題) --- */
        /* 增加一個全域的背景光暈，把金與藍融合在一起 */
        .ambient-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(30, 30, 50, 0.3) 0%, rgba(0, 0, 0, 1) 80%);
            z-index: 0;
            pointer-events: none; /* 確保不擋住點擊 */
        }

        /* --- 1. 左側圖片：金色呼吸光芒 --- */
        @keyframes golden-breath {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 35px rgba(255, 215, 0, 0.7)) 
                        drop-shadow(0 0 70px rgba(255, 140, 0, 0.4));
                transform: scale(1.02);
            }
        }
        .golden-glow-img {
            animation: golden-breath 4s ease-in-out infinite; /* 放慢一點，更有質感 */
            max-width: 80%;
            height: auto;
            position: relative;
            z-index: 10;
        }
        @media (min-width: 768px) {
            .golden-glow-img { max-width: 65%; }
        }

        /* --- 2. 3D 視差容器 --- */
        .perspective-container {
            perspective: 1200px; /* 拉遠一點視角，讓轉動更自然 */
        }

        .parallax-card {
            /* 變數由 JS 控制 */
            --rotateX: 0deg;
            --rotateY: 0deg;
            transform: rotateX(var(--rotateX)) rotateY(var(--rotateY));
            transition: transform 0.15s ease-out; /* 稍微調慢一點點，增加重量感 */
            transform-style: preserve-3d;
            z-index: 20;
        }

        .glowing-box {
            /* 藍色發光 */
            box-shadow: 0 0 25px rgba(79, 70, 229, 0.5), 
                        0 0 50px rgba(79, 70, 229, 0.3), 
                        0 20px 60px rgba(0, 0, 0, 0.7);
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- 3. 輸入框特效 --- */
        .glowing-button {
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.5);
            transition: all 0.3s;
        }
        .glowing-button:hover {
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.8);
            transform: scale(1.02);
        }

        @keyframes flicker-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(79, 70, 229, 0.4); border-color: #6366f1; }
            50% { box-shadow: 0 0 15px rgba(79, 70, 229, 0.8); border-color: #4f46e5; }
        }
        .flickering-input {
            animation: flicker-glow 1.2s infinite alternate;
        }

        /* 入場動畫 */
        @keyframes fadeZoomIn { 
            from { opacity: 0; transform: scale(0.9) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="relative w-full max-w-7xl mx-auto h-full flex flex-col md:flex-row items-center justify-center z-10 p-6 gap-8 md:gap-0">

        <div class="w-full md:w-1/2 flex items-center justify-center order-1 md:order-1">
            <img src="icon4.png" alt="Logo" class="golden-glow-img">
        </div>

        <div class="w-full md:w-1/2 flex items-center justify-center perspective-container order-2 md:order-2">
            
            <div id="login-card" class="bg-white p-8 md:p-10 rounded-2xl w-full max-w-sm text-center glowing-box parallax-card" 
                 style="animation: fadeZoomIn 0.6s ease-out;">
                
                <h2 class="text-3xl font-bold text-slate-800 mb-2">課程系統登入</h2>
                <p class="text-slate-500 mb-8 text-sm">內部訓練專用系統</p>
                
                <div class="space-y-6">
                    <div class="relative">
                        <input type="text" id="username-input" 
                            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-lg bg-slate-50 focus:bg-white focus:outline-none transition duration-200 placeholder-slate-400" 
                            placeholder="請輸入帳號">
                    </div>
                    <div class="relative">
                        <input type="password" id="password-input" 
                            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-lg bg-slate-50 focus:bg-white focus:outline-none transition duration-200 placeholder-slate-400" 
                            placeholder="請輸入密碼">
                    </div>
                </div>

                <p id="error-message" class="text-red-500 h-6 mt-3 text-sm font-bold"></p>
                
                <button id="submit-password" 
                    class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg mt-2 glowing-button text-lg tracking-wide">
                    登入課程
                </button>

                <div class="mt-8 border-t border-slate-100 pt-4">
                    <p class="text-xs text-slate-400">Copyright © 2025 李培智. All Rights Reserved.</p>
                </div>
            </div>
        </div>

    </div>

   <script>
    document.addEventListener('DOMContentLoaded', () => {
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const submitButton = document.getElementById('submit-password');
        const errorMessage = document.getElementById('error-message');
        const loginCard = document.getElementById('login-card');

        // --- 1. 輸入框閃爍特效 ---
        function addFlicker(e) { e.target.classList.add('flickering-input'); }
        function removeFlicker(e) { e.target.classList.remove('flickering-input'); }
        
        [usernameInput, passwordInput].forEach(input => {
            input.addEventListener('focus', addFlicker);
            input.addEventListener('blur', removeFlicker);
        });

        // --- 2. 全域 3D 浮動特效 (修正版) ---
        // 我們現在監聽 document，讓滑鼠在畫面任何地方都能觸發轉動
        document.addEventListener('mousemove', (e) => {
            // 手機版通常不需要這個特效，避免干擾滑動
            if (window.innerWidth < 768) return;

            // 取得登入卡片的中心點位置
            const rect = loginCard.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;

            // 計算滑鼠相對於卡片中心的距離
            // 為了讓轉動更平滑，我們把螢幕寬度當作參考分母
            const x = e.clientX - cardCenterX;
            const y = e.clientY - cardCenterY;

            // 設定轉動係數 (數字越小轉動越小)
            // 我們讓 Y 軸轉動(左右傾斜)稍微明顯一點
            const sensitivity = 25; 

            // 計算旋轉角度
            // 滑鼠在右邊 -> 卡片要往右轉 -> rotateY 是正值
            // 滑鼠在上面 -> 卡片要往上仰 -> rotateX 是正值
            const rotateY = (x / window.innerWidth) * sensitivity;
            const rotateX = -(y / window.innerHeight) * sensitivity;

            loginCard.style.setProperty('--rotateX', `${rotateX}deg`);
            loginCard.style.setProperty('--rotateY', `${rotateY}deg`);
        });

        // 當滑鼠移出視窗時，讓卡片慢慢回正
        document.addEventListener('mouseleave', () => {
            loginCard.style.setProperty('--rotateX', `0deg`);
            loginCard.style.setProperty('--rotateY', `0deg`);
        });

        // --- 3. 登入功能 ---
        async function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            errorMessage.textContent = '';
            submitButton.disabled = true;
            submitButton.textContent = '驗證中...';
            submitButton.classList.add('opacity-75', 'cursor-wait');

            try {
                const response = await fetch('/.netlify/functions/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('loggedInUser', data.username);
                    sessionStorage.setItem('loggedInName', data.name);
                    sessionStorage.setItem('loggedInRole', data.role); 
                    sessionStorage.setItem('loggedInTeam', data.team);
                    window.location.href = '/course.html';
                } else {
                    errorMessage.textContent = data.message || '帳號或密碼錯誤';
                    passwordInput.value = '';
                    passwordInput.focus();
                    // 錯誤時輕微震動
                    loginCard.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 300 });
                }
            } catch (error) {
                errorMessage.textContent = '網路連線錯誤，請稍後再試。';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = '登入課程';
                submitButton.classList.remove('opacity-75', 'cursor-wait');
            }
        }

        submitButton.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordInput.focus(); });
    });
   </script>
</body>
</html>
