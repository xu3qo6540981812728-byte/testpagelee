<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* --- 自定義樣式開始 --- */

        /* 1. 整體容器：設定為 Flex 佈局 */
        .login-container {
            min-height: 100vh;
            display: flex;
            /* 手機優先：預設為垂直排列 (Column) */
            flex-direction: column;
        }

        /* 2. 左側圖片區塊樣式 */
        .brand-section {
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%); /* 深色漸層背景，凸顯金色 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            min-height: 35vh; /* 手機版至少佔高 35% */
            overflow: hidden;
            position: relative;
        }

        /* 3. 右側表單區塊樣式 */
        .form-section {
            flex: 1; /* 佔滿剩餘空間 */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f7fafc; /* 淺灰背景，乾淨俐落 */
            padding: 2rem;
        }

        /* 表單本身的容器限制寬度 */
        .form-box {
            width: 100%;
            max-width: 420px;
            /* 手機版增加一點圓角和陰影，讓它浮起來 */
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }


        /* --- 桌面版 (寬度大於 768px) 佈局調整 --- */
        @media (min-width: 768px) {
            .login-container {
                /* 改為水平排列 (Row) */
                flex-direction: row;
            }

            .brand-section {
                flex: 1; /* 左側佔一半 */
                min-height: 100vh; /* 滿高 */
                padding: 0;
            }

            .form-section {
                flex: 1; /* 右側佔一半 */
                padding: 4rem;
                background-color: white; /* 桌面版背景改全白 */
            }
            
            .form-box {
                box-shadow: none; /* 桌面版移除陰影，更平面化 */
                padding: 0;
            }
        }
        /* ---------------------------------- */


        /* --- 金色光芒動畫設計 --- */

        /* 定義關鍵影格動畫：GoldenPulse */
        @keyframes goldenPulse {
            0% {
                /* 初始狀態：較弱的金光 */
                filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
                transform: scale(1);
            }
            50% {
                /* 中間狀態：強烈的金光，並稍微放大 */
                /* 使用兩個 drop-shadow 疊加，製造層次感 */
                filter: drop-shadow(0 0 30px rgba(255, 223, 0, 0.8)) 
                        drop-shadow(0 0 60px rgba(212, 175, 55, 0.4));
                transform: scale(1.03); /* 輕微的呼吸放大效果 */
            }
            100% {
                /* 回到初始狀態 */
                filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
                transform: scale(1);
            }
        }

        .glowing-logo {
            max-width: 80%; /* 手機版大小 */
            height: auto;
            /* 套用動畫：時長 3秒，緩入緩出，無限循環 */
            animation: goldenPulse 3s ease-in-out infinite;
            /* 確保在深色背景上看起來更有質感 */
            opacity: 0.95;
        }

        /* 桌面版圖片大一點 */
        @media (min-width: 768px) {
            .glowing-logo {
                max-width: 60%;
            }
        }

        /* --- 自定義樣式結束 --- */
    </style>
</head>
<body> <div class="login-container">
        
        <div class="brand-section">
            <img src="images/icon4.png" alt="Logo" class="glowing-logo">
        </div>

        <div class="form-section">
            <div class="form-box space-y-8"> <div class="text-center">
                    <h2 class="text-3xl font-extrabold text-gray-900">登入系統</h2>
                    <p class="mt-2 text-sm text-gray-600">請輸入您的帳號密碼以繼續</p>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">帳號</label>
                        <input type="text" id="username" name="username" required 
                            class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-200"
                            placeholder="請輸入帳號">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                        <input type="password" id="password" name="password" required 
                            class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-200"
                            placeholder="請輸入密碼">
                    </div>
                    <div>
                        <button type="submit" 
                            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300 transform hover:scale-[1.02]">
                            登入
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="login.js"></script>
</body>
</html>
