<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菁英班教育訓練 - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #password-modal {
    /* 設定視角，讓變換看起來是 3D 的 */
    perspective: 1000px;
}
.parallax-card {
    /* 定義旋轉的 CSS 變量 */
    --rotateX: 0deg;
    --rotateY: 0deg;
    /* 應用 3D 變換 */
    transform: rotateX(var(--rotateX)) rotateY(var(--rotateY));
    /* 讓變換更流暢 */
    transition: transform 0.1s ease-out;
    transform-style: preserve-3d; /* 保留子元素的 3D 位置 */
}
        .glowing-box {
    box-shadow: 0 0 10px rgba(79, 70, 229, 0.5), 0 0 20px rgba(79, 70, 229, 0.3), 0 10px 30px rgba(0, 0, 0, 0.1);
    transition: box-shadow 0.3s ease-in-out;
}
.glowing-box:hover {
    box-shadow: 0 0 15px rgba(79, 70, 229, 0.7), 0 0 30px rgba(79, 70, 229, 0.5), 0 15px 40px rgba(0, 0, 0, 0.2);
}

/* 登入按鈕發光效果 (使用 Tailwind 的 indigo-600 顏色) */
.glowing-button {
    box-shadow: 0 4px 15px rgba(79, 70, 229, 0.6), 0 0 10px rgba(79, 70, 229, 0.3);
    transition: box-shadow 0.3s ease-in-out;
}
.glowing-button:hover {
    box-shadow: 0 6px 20px rgba(79, 70, 229, 0.8), 0 0 15px rgba(79, 70, 229, 0.5);
}
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        body { background-color: #f0f4f8; }
    </style>
</head>
<body>
    <div id="password-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-75 backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center glowing-box parallax-card" style="animation: zoomIn 0.3s ease-out;">
            <h2 class="text-2xl font-bold text-slate-800 mb-4">課程系統登入</h2>
            <p class="text-slate-500 mb-6">此為內部訓練課程，請輸入您的帳號密碼。</p>
            <input type="text" id="username-input" class="w-full px-4 py-3 border-2 border-slate-300 rounded-lg text-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition mb-4" placeholder="請輸入帳號">
            <input type="password" id="password-input" class="w-full px-4 py-3 border-2 border-slate-300 rounded-lg text-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="請輸入密碼">
            <p id="error-message" class="text-red-500 h-6 mt-2 text-sm"></p>
            <button id="submit-password" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-300 mt-4 glowing-button">
    登入課程
</button>
        </div>

        <footer class="absolute bottom-0 left-0 right-0 text-center py-6 text-sm text-slate-300 w-full">
            <p>Copyright © 2025 李培智. All Rights Reserved.</p>
        </footer>
    </div>

   <script>
    document.addEventListener('DOMContentLoaded', () => {
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const submitButton = document.getElementById('submit-password');
        const errorMessage = document.getElementById('error-message');

        async function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            errorMessage.textContent = '';
            submitButton.disabled = true;
            submitButton.textContent = '登入中...';

            try {
                const response = await fetch('/.netlify/functions/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('loggedInUser', data.username);
                    sessionStorage.setItem('loggedInName', data.name);
                    sessionStorage.setItem('loggedInRole', data.role); 
                    sessionStorage.setItem('loggedInTeam', data.team);
                    window.location.href = '/course.html';
                } else {
                    errorMessage.textContent = data.message || '登入失敗，請重試。';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                errorMessage.textContent = '網路連線錯誤，請稍後再試。';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = '登入課程';
            }
        }

        submitButton.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordInput.focus(); });
    const loginCard = document.querySelector('.parallax-card');
const loginContainer = document.getElementById('password-modal'); // 使用父容器作為事件監聽

if (loginCard && loginContainer) {
    loginContainer.addEventListener('mousemove', (e) => {
        // 獲取容器和卡片的大小與位置
        const rect = loginContainer.getBoundingClientRect();
        
        // 計算滑鼠在容器中的相對位置 (x: 0~1, y: 0~1)
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // 計算中心點的偏差 (normalized to -0.5 to 0.5)
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const offsetX = (x - centerX) / centerX;
        const offsetY = (y - centerY) / centerY;

        // 設定最大旋轉角度 (MAX_ROTATION)
        const MAX_ROTATION = 5; 

        // 計算旋轉角度 (X 軸旋轉與 Y 軸滑鼠相反，Y 軸旋轉與 X 軸滑鼠相反)
        const rotateY = offsetX * MAX_ROTATION;
        const rotateX = -offsetY * MAX_ROTATION;

        // 應用 CSS 變量
        loginCard.style.setProperty('--rotateX', `${rotateX}deg`);
        loginCard.style.setProperty('--rotateY', `${rotateY}deg`);
    });

    // 當滑鼠移出容器時，將卡片歸位
    loginContainer.addEventListener('mouseleave', () => {
        loginCard.style.setProperty('--rotateX', '0deg');
        loginCard.style.setProperty('--rotateY', '0deg');
    });
}
    });
   </script>
</body>

</html>
