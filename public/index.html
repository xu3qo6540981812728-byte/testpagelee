<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菁英班教育訓練 - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 核心背景設定 --- */
        body {
            background-color: #000000;
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 背景環境氛圍 (微弱的藍色底光，避免畫面太死黑) --- */
        .ambient-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 50%, rgba(20, 20, 40, 0.4) 0%, #000000 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* --- 1. 左側圖片：金色呼吸光芒 --- */
        @keyframes golden-breath {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.7));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 35px rgba(255, 215, 0, 1)) 
                        drop-shadow(0 0 70px rgba(255, 140, 0, 0.7));
                transform: scale(1.02);
            }
        }
        .golden-glow-img {
            animation: golden-breath 4s ease-in-out infinite;
            max-width: 80%;
            height: auto;
            position: relative;
            z-index: 10;
        }
        @media (min-width: 768px) {
            .golden-glow-img { max-width: 65%; }
        }

        /* --- 2. 2D 浮動卡片容器 --- */
        .floating-container {
            /* 不需要 perspective 了，因為是平面移動 */
            position: relative;
            z-index: 20;
        }

        .floating-card {
            /* 定義移動變數，由 JS 控制 */
            --moveX: 0px;
            --moveY: 0px;
            /* 核心修改：改為 translate (平移) */
            transform: translate(var(--moveX), var(--moveY));
            /* 增加一點點延遲 (0.1s -> 0.2s)，讓移動有種「漂浮」的慣性 */
            transition: transform 0.2s ease-out; 
            
            /* 強效發光設定 */
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* 三層光暈：內層白光邊緣 + 中層靛藍光 + 外層擴散光 */
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(79, 70, 229, 0.8), 
                0 0 60px rgba(79, 70, 229, 0.5);
        }

        /* 滑鼠懸停時，光暈更強 */
        .floating-card:hover {
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(79, 70, 229, 1), 
                0 0 80px rgba(79, 70, 229, 0.6);
        }

        /* --- 3. 輸入框與按鈕特效 --- */
        .glowing-button {
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.6);
            transition: all 0.3s;
        }
        .glowing-button:hover {
            box-shadow: 0 0 25px rgba(79, 70, 229, 0.9);
            transform: scale(1.02);
        }

        @keyframes flicker-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(99, 102, 241, 0.6); border-color: #6366f1; }
            50% { box-shadow: 0 0 20px rgba(79, 70, 229, 1); border-color: #4f46e5; }
        }
        .flickering-input {
            animation: flicker-glow 1.0s infinite alternate;
            background-color: #fff; /* 確保輸入時背景亮白 */
        }

        /* 入場動畫 */
        @keyframes fadeZoomIn { 
            from { opacity: 0; transform: scale(0.95) translateY(20px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="relative w-full max-w-7xl mx-auto h-full flex flex-col md:flex-row items-center justify-center z-10 p-6 gap-8 md:gap-0">

        <div class="w-full md:w-1/2 flex items-center justify-center order-1 md:order-1">
            <img src="images/icon4.png" alt="Logo" class="golden-glow-img">
        </div>

        <div class="w-full md:w-1/2 flex items-center justify-center floating-container order-2 md:order-2">
            
            <div id="login-card" class="bg-white p-8 md:p-10 rounded-2xl w-full max-w-sm text-center floating-card" 
                 style="animation: fadeZoomIn 0.6s ease-out;">
                
                <h2 class="text-3xl font-bold text-slate-800 mb-2">課程系統登入</h2>
                <p class="text-slate-500 mb-8 text-sm">內部訓練專用系統</p>
                
                <div class="space-y-6">
                    <div class="relative">
                        <input type="text" id="username-input" 
                            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-lg bg-slate-50 focus:bg-white focus:outline-none transition duration-200 placeholder-slate-400" 
                            placeholder="請輸入帳號">
                    </div>
                    <div class="relative">
                        <input type="password" id="password-input" 
                            class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg text-lg bg-slate-50 focus:bg-white focus:outline-none transition duration-200 placeholder-slate-400" 
                            placeholder="請輸入密碼">
                    </div>
                </div>

                <p id="error-message" class="text-red-500 h-6 mt-3 text-sm font-bold"></p>
                
                <button id="submit-password" 
                    class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg mt-2 glowing-button text-lg tracking-wide">
                    登入課程
                </button>

                <div class="mt-8 border-t border-slate-100 pt-4">
                    <p class="text-xs text-slate-400">Copyright © 2025 李培智. All Rights Reserved.</p>
                </div>
            </div>
        </div>

    </div>

   <script>
    document.addEventListener('DOMContentLoaded', () => {
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const submitButton = document.getElementById('submit-password');
        const errorMessage = document.getElementById('error-message');
        const loginCard = document.getElementById('login-card');

        // --- 1. 輸入框閃爍特效 ---
        function addFlicker(e) { e.target.classList.add('flickering-input'); }
        function removeFlicker(e) { e.target.classList.remove('flickering-input'); }
        
        [usernameInput, passwordInput].forEach(input => {
            input.addEventListener('focus', addFlicker);
            input.addEventListener('blur', removeFlicker);
        });

        // --- 2. 2D 平面浮動特效 (Translate X/Y) ---
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return; // 手機版禁用

            // 計算卡片中心
            const rect = loginCard.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;

            // 計算滑鼠距離中心的偏移量
            const x = e.clientX - cardCenterX;
            const y = e.clientY - cardCenterY;

            // 設定移動係數 (Movement Factor)
            // 數字越小，移動距離越短
            // 負號 (-) 代表反向移動 (滑鼠往右，卡片稍微往左)，這通常更有「懸浮感」
            // 如果想要卡片跟著滑鼠跑，把負號拿掉即可
            const factor = -0.03; 

            const moveX = x * factor;
            const moveY = y * factor;

            loginCard.style.setProperty('--moveX', `${moveX}px`);
            loginCard.style.setProperty('--moveY', `${moveY}px`);
        });

        // 當滑鼠移出時，卡片慢慢回正
        document.addEventListener('mouseleave', () => {
            loginCard.style.setProperty('--moveX', `0px`);
            loginCard.style.setProperty('--moveY', `0px`);
        });

        // --- 3. 登入功能 (保持不變) ---
        async function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            errorMessage.textContent = '';
            submitButton.disabled = true;
            submitButton.textContent = '驗證中...';
            submitButton.classList.add('opacity-75');

            try {
                const response = await fetch('/.netlify/functions/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('loggedInUser', data.username);
                    sessionStorage.setItem('loggedInName', data.name);
                    sessionStorage.setItem('loggedInRole', data.role); 
                    sessionStorage.setItem('loggedInTeam', data.team);
                    window.location.href = '/course.html';
                } else {
                    errorMessage.textContent = data.message || '帳號或密碼錯誤';
                    passwordInput.value = '';
                    passwordInput.focus();
                    
                    // 2D 左右震動動畫 (Shake)
                    loginCard.animate([
                        { transform: `translate(calc(var(--moveX) - 10px), var(--moveY))` },
                        { transform: `translate(calc(var(--moveX) + 10px), var(--moveY))` },
                        { transform: `translate(calc(var(--moveX) - 10px), var(--moveY))` },
                        { transform: `translate(var(--moveX), var(--moveY))` }
                    ], { duration: 400 });
                }
            } catch (error) {
                errorMessage.textContent = '網路連線錯誤，請稍後再試。';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = '登入課程';
                submitButton.classList.remove('opacity-75');
            }
        }

        submitButton.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') passwordInput.focus(); });
    });
   </script>
</body>
</html>
